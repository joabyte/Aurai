
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Core</title>
    <style>
        body { background: #0a0f1e; color: #eee; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #161b22; border-radius: 12px; padding: 20px; border: 1px solid #30363d; }
        #chat { height: 400px; overflow-y: auto; margin-bottom: 15px; padding: 10px; border-bottom: 1px solid #30363d; }
        .user { text-align: right; color: #58a6ff; margin: 10px 0; }
        .aura { text-align: left; color: #39FF14; margin: 10px 0; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 6px; }
        button { background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; }
        .status { font-size: 11px; color: #8b949e; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="status" id="status">Sincronizando...</div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="prompt" placeholder="Orden, señor...">
        <button id="btn">EJECUTAR</button>
    </div>
</div>
<script>
    async function check() {
        try {
            const r = await fetch('/status');
            const d = await r.json();
            document.getElementById('status').innerText = d.api_key_configured ? '● SISTEMA ONLINE' : '○ ERROR DE LLAVE';
        } catch(e) { document.getElementById('status').innerText = '○ OFFLINE'; }
    }
    check();

    document.getElementById('btn').onclick = async () => {
        const p = document.getElementById('prompt');
        const chat = document.getElementById('chat');
        if(!p.value) return;
        
        chat.innerHTML += `<div class="user">> ${p.value}</div>`;
        const query = p.value;
        p.value = 'Procesando...';
        p.disabled = true;

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: query })
            });
            const data = await res.json();
            chat.innerHTML += `<div class="aura"><b>AURA:</b> ${data.res}</div>`;
        } catch(e) {
            chat.innerHTML += `<div class="aura"><b>AURA:</b> Error de conexión.</div>`;
        }
        p.value = '';
        p.disabled = false;
        chat.scrollTop = chat.scrollHeight;
    };
</script>
</body>
</html>
