
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Core</title>
    <style>
        body { background: #000; color: #ff6600; font-family: monospace; margin: 0; padding: 15px; }
        #chat { border: 1px solid #ff6600; height: 70vh; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        .aura { color: #00ffcc; margin: 10px 0; border-left: 2px solid #00ffcc; padding-left: 5px; }
        .user { color: #ff6600; text-align: right; margin: 10px 0; font-weight: bold; }
        input { width: 70%; background: #111; border: 1px solid #ff6600; color: #ff6600; padding: 12px; }
        button { background: #ff6600; color: #000; border: none; padding: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <h1 style="text-align:center; font-size: 1.2em;">AURA OPERATIVE SYSTEM</h1>
    <div id="chat"></div>
    <div style="display:flex; gap:5px;">
        <input type="text" id="msg" placeholder="Ordenes, señor..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">LOG</button>
    </div>
    <script>
        async function send() {
            const i = document.getElementById("msg");
            const c = document.getElementById("chat");
            const val = i.value; if(!val) return;
            c.innerHTML += `<div class="user">> ${val}</div>`;
            i.value = "";
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: val})
            });
            const data = await res.json();
            c.innerHTML += `<div class="aura"><b>AURA:</b> ${data.res}</div>`;
            c.scrollTop = c.scrollHeight;
        }
    </script>
</body>
</html>
