
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA</title>
    <style>
        body { background: #0a0f1e; color: #39FF14; font-family: monospace; padding: 20px; }
        #chat { height: 70vh; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
        .u { color: #58a6ff; text-align: right; }
        input { width: 70%; background: #000; color: #fff; border: 1px solid #39FF14; padding: 10px; }
        button { background: #39FF14; color: #000; border: none; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="status">Sincronizando...</div>
    <div id="chat"></div>
    <input type="text" id="p" placeholder="Orden, señor...">
    <button onclick="send()">EJECUTAR</button>
<script>
    async function check() {
        const res = await fetch('/status');
        const d = await res.json();
        document.getElementById('status').innerText = d.ready ? '● SISTEMA ONLINE' : '○ ERROR DE LLAVE';
    }
    check();
    async function send() {
        const p = document.getElementById('p');
        const chat = document.getElementById('chat');
        const val = p.value;
        if(!val) return;
        chat.innerHTML += `<div class="u">> ${val}</div>`;
        p.value = 'Procesando...';
        const res = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({prompt: val})
        });
        const d = await res.json();
        chat.innerHTML += `<div>AURA: ${d.res}</div>`;
        p.value = '';
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
