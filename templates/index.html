<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AURA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#030306; --surface:#08080f; --border:#12122a;
  --accent:#6d5dfc; --accent2:#a78bfa; --cyan:#22d3ee;
  --green:#4ade80; --text:#ddddf5; --muted:#555570; --danger:#f87171;
}
body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-text { font-size:1.1rem; font-weight:200; letter-spacing:0.45em; color:var(--accent2); }
#status-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); transition:all 0.5s; }
#status-dot.online { background:var(--green); box-shadow:0 0 8px var(--green); }
#status-dot.error  { background:var(--danger); }
.hdr-right { display:flex; gap:8px; align-items:center; }
.hdr-btn { background:none; border:none; color:var(--muted); font-size:0.65rem; letter-spacing:0.15em; cursor:pointer; transition:color 0.2s; padding:4px; }
.hdr-btn:hover { color:var(--danger); }

#perm-bar { display:flex; gap:6px; flex-wrap:wrap; padding:8px 14px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
.perm-btn { display:flex; align-items:center; gap:4px; padding:5px 10px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:0.67rem; letter-spacing:0.07em; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.perm-btn:hover   { border-color:var(--accent); color:var(--accent2); }
.perm-btn.granted { border-color:var(--green);  color:var(--green);   background:#0a1f12; }
.perm-btn.denied  { border-color:var(--danger); color:var(--danger);  background:#1f0a0a; }
.perm-btn.active  { border-color:var(--cyan);   color:var(--cyan);    background:#0a1820; animation:pulse-border 1s infinite; }
@keyframes pulse-border { 0%,100%{box-shadow:0 0 0 0 #22d3ee44} 50%{box-shadow:0 0 0 4px #22d3ee11} }

.orb-wrap { display:flex; justify-content:center; padding:14px 0 4px; flex-shrink:0; }
.orb { width:64px; height:64px; border-radius:50%; cursor:pointer; position:relative;
  background:radial-gradient(circle at 35% 35%, #a78bfa, #3b1f8c 60%, #030306);
  box-shadow:0 0 25px #6d5dfc44, 0 0 50px #6d5dfc22;
  animation:pulse 3s ease-in-out infinite; transition:all 0.3s; }
.orb::after  { content:""; position:absolute; inset:4px;  border-radius:50%; border:1px solid #a78bfa33; }
.orb::before { content:""; position:absolute; inset:-4px; border-radius:50%; border:1px solid #6d5dfc22; animation:spin 8s linear infinite; }
@keyframes spin       { to{transform:rotate(360deg)} }
@keyframes pulse      { 0%,100%{transform:scale(1);opacity:.9}    50%{transform:scale(1.06);opacity:1} }
@keyframes pulse-fast { 0%,100%{transform:scale(1)}               50%{transform:scale(1.13)} }
@keyframes rot-hue    { from{filter:hue-rotate(0deg)} to{filter:hue-rotate(360deg)} }
.orb.listening { animation:pulse-fast 0.7s infinite; box-shadow:0 0 40px #a78bfa88, 0 0 80px #6d5dfc44; }
.orb.thinking  { animation:rot-hue 1.5s linear infinite; background:radial-gradient(circle at 35% 35%,#60a5fa,#1e3a8a 60%,#030306); box-shadow:0 0 40px #60a5fa66; }
.orb.searching { animation:rot-hue 1s   linear infinite; background:radial-gradient(circle at 35% 35%,#22d3ee,#164e63 60%,#030306); box-shadow:0 0 40px #22d3ee66; }
.orb.capturing { animation:pulse-fast 0.5s infinite; background:radial-gradient(circle at 35% 35%,#f87171,#7f1d1d 60%,#030306); box-shadow:0 0 40px #f8717166; }

#status-line { text-align:center; font-size:0.63rem; letter-spacing:0.2em; color:var(--muted); padding:4px 0 8px; flex-shrink:0; min-height:22px; transition:color 0.3s; }
#status-line.search { color:var(--cyan); }
#status-line.listen { color:var(--accent2); }
#status-line.think  { color:#60a5fa; }

#chat { flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:8px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.msg { max-width:88%; padding:10px 14px; border-radius:16px; font-size:0.85rem; line-height:1.6; animation:fadeIn 0.2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1} }
.msg.user   { align-self:flex-end;   background:#10102a; border:1px solid var(--border); color:var(--accent2); }
.msg.aura   { align-self:flex-start; background:var(--surface); border:1px solid #1e1a40; color:var(--text); }
.msg.aura .sender { font-size:0.6rem; color:var(--accent); letter-spacing:0.2em; margin-bottom:5px; }
.msg.system { align-self:center; background:transparent; color:var(--muted); font-size:0.68rem; letter-spacing:0.1em; border:none; padding:3px; }
.msg.img-preview { align-self:flex-end; padding:6px; background:#10102a; border:1px solid var(--border); border-radius:14px; }
.msg.img-preview img { max-width:180px; border-radius:10px; display:block; }

.input-area { padding:10px 14px; border-top:1px solid var(--border); background:var(--surface); display:flex; gap:7px; align-items:flex-end; flex-shrink:0; }
#input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:9px 13px; font-size:0.85rem; font-family:inherit; resize:none; max-height:90px; outline:none; transition:border-color 0.2s; }
#input:focus { border-color:var(--accent); }
#input::placeholder { color:var(--muted); }
.btn { width:40px; height:40px; border-radius:11px; border:1px solid var(--border); background:var(--bg); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.95rem; transition:all 0.2s; flex-shrink:0; }
.btn:hover   { border-color:var(--accent); color:var(--accent2); }
.btn.mic-on  { background:#2d1f6e; border-color:var(--accent2); color:var(--accent2); animation:pulse-fast 0.8s infinite; }
.btn.send    { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.send:hover { background:var(--accent2); }
#cam-input, #file-input { display:none; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div id="status-dot"></div>
    <span class="logo-text">AURA</span>
  </div>
  <div class="hdr-right">
    <button class="btn" id="fs-btn" onclick="toggleFS()" title="Pantalla completa" style="width:32px;height:32px;font-size:0.8rem;">⛶</button>
    <button class="hdr-btn" onclick="clearHistory()">LIMPIAR</button>
  </div>
</header>

<div id="perm-bar">
  <button class="perm-btn" id="perm-mic"   onclick="reqMic()">🎙️ MIC</button>
  <button class="perm-btn" id="perm-cam"   onclick="reqCam()">📷 CAM</button>
  <button class="perm-btn" id="perm-gps"   onclick="reqGPS()">📍 GPS</button>
  <button class="perm-btn" id="perm-notif" onclick="reqNotif()">🔔 NOTIF</button>
  <button class="perm-btn" id="perm-clip"  onclick="reqClip()">📋 CLIP</button>
  <button class="perm-btn" id="perm-share" onclick="shareContent()">↗️ SHARE</button>
</div>

<div class="orb-wrap">
  <div class="orb" id="orb" onclick="toggleMic()" title="Hablar con AURA"></div>
</div>
<div id="status-line">EN ESPERA</div>

<div id="chat">
  <div class="msg system">AURA inicializada · Activá los permisos para habilitar funciones</div>
</div>

<div class="input-area">
  <input type="file" id="cam-input"  accept="image/*" capture="environment" onchange="handlePhoto(this)">
  <input type="file" id="file-input" accept="image/*" onchange="handlePhoto(this)">
  <textarea id="input" rows="1" placeholder="Orden, señor..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="btn" onclick="document.getElementById('cam-input').click()" title="Cámara">📷</button>
  <button class="btn" id="mic-btn" onclick="toggleMic()" title="Voz">🎙️</button>
  <button class="btn send" onclick="send()">➤</button>
</div>

<script>
const S = { mic:false, cam:false, gps:false, notif:false, clip:false, listening:false, image:null, location:null, recognition:null };

async function checkStatus() {
  try { const d = await (await fetch("/status")).json(); document.getElementById("status-dot").className = d.ready ? "online" : "error"; }
  catch { document.getElementById("status-dot").className = "error"; }
}
checkStatus();

function setOrb(c)  { document.getElementById("orb").className = "orb " + c; }
function setSL(t,c) { const e = document.getElementById("status-line"); e.textContent = t; e.className = c || ""; }
function setPerm(id,st) { const e = document.getElementById("perm-"+id); if(e) e.className = "perm-btn " + st; }

function addMsg(text, type) {
  const chat = document.getElementById("chat");
  const div  = document.createElement("div");
  div.className = "msg " + type;
  if (type === "aura") div.innerHTML = "<div class=\"sender\">A · U · R · A</div>" + esc(text);
  else if (type === "img-preview") div.innerHTML = text;
  else div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function esc(t) { return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
function autoResize(el) { el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,90)+"px"; }
function handleKey(e) { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }

// PERMISOS
async function reqMic() {
  try { await navigator.mediaDevices.getUserMedia({audio:true}); S.mic=true; setPerm("mic","granted"); addMsg("Micrófono activado, señor.","system"); }
  catch { setPerm("mic","denied"); addMsg("Permiso de micrófono denegado, señor.","system"); }
}
async function reqCam() {
  try { const s=await navigator.mediaDevices.getUserMedia({video:true}); s.getTracks().forEach(t=>t.stop()); S.cam=true; setPerm("cam","granted"); addMsg("Cámara activada, señor.","system"); }
  catch { setPerm("cam","denied"); addMsg("Permiso de cámara denegado, señor.","system"); }
}
function reqGPS() {
  if (!navigator.geolocation) { addMsg("GPS no disponible, señor.","system"); return; }
  setPerm("gps","active"); setSL("OBTENIENDO UBICACIÓN...","search");
  navigator.geolocation.getCurrentPosition(
    pos => {
      S.location = { lat:pos.coords.latitude.toFixed(6), lon:pos.coords.longitude.toFixed(6), accuracy:Math.round(pos.coords.accuracy) };
      S.gps=true; setPerm("gps","granted"); setSL("EN ESPERA");
      addMsg("Ubicación obtenida: "+S.location.lat+", "+S.location.lon+" (±"+S.location.accuracy+"m), señor.","system");
    },
    () => { setPerm("gps","denied"); setSL("EN ESPERA"); addMsg("Permiso de ubicación denegado, señor.","system"); },
    {enableHighAccuracy:true, timeout:10000}
  );
}
async function reqNotif() {
  if (!("Notification" in window)) { addMsg("Notificaciones no soportadas, señor.","system"); return; }
  const p = await Notification.requestPermission();
  if (p==="granted") { S.notif=true; setPerm("notif","granted"); new Notification("AURA",{body:"Sistema de notificaciones activo, señor."}); }
  else { setPerm("notif","denied"); addMsg("Permiso de notificaciones denegado, señor.","system"); }
}
async function reqClip() {
  try {
    const text = await navigator.clipboard.readText();
    S.clip=true; setPerm("clip","granted");
    addMsg("Portapapeles: \""+text.substring(0,80)+(text.length>80?"...":"")+"\" — ¿proceso esto, señor?","system");
    document.getElementById("input").value = "Analiza esto del portapapeles: "+text.substring(0,300);
    autoResize(document.getElementById("input"));
  } catch { setPerm("clip","denied"); addMsg("No se pudo leer el portapapeles, señor.","system"); }
}
async function shareContent() {
  const last = [...document.querySelectorAll(".msg.aura")].pop();
  const text = last ? last.innerText.replace("A · U · R · A","AURA:").trim() : "AURA — IA";
  if (navigator.share) { try { await navigator.share({title:"AURA",text}); addMsg("Contenido compartido, señor.","system"); } catch{} }
  else { await navigator.clipboard.writeText(text); addMsg("Copiado al portapapeles, señor.","system"); }
}

// FOTO
function handlePhoto(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    S.image = e.target.result.split(",")[1];
    addMsg("<img src=\""+e.target.result+"\" alt=\"foto\">","img-preview");
    input.value="";
    if (!document.getElementById("input").value.trim()) document.getElementById("input").value="Analiza esta imagen.";
    addMsg("Imagen cargada. Enviá tu orden o tocá ➤ para analizarla, señor.","system");
  };
  reader.readAsDataURL(file);
}

// FULLSCREEN
function toggleFS() {
  const el = document.documentElement;
  if (!document.fullscreenElement) { el.requestFullscreen&&el.requestFullscreen(); document.getElementById("fs-btn").textContent="✕"; }
  else { document.exitFullscreen&&document.exitFullscreen(); document.getElementById("fs-btn").textContent="⛶"; }
}

// ENVIAR
async function send() {
  const inp = document.getElementById("input");
  const val = inp.value.trim();
  if (!val && !S.image) return;
  if (val) addMsg(val,"user");
  inp.value=""; inp.style.height="auto";
  setOrb("thinking"); setSL("PROCESANDO...","think");

  const payload = {prompt:val};
  if (S.image)    { payload.image    = S.image;    S.image=null; }
  if (S.location) { payload.location = S.location; }
  if (S.clip && val.toLowerCase().includes("portapapeles")) {
    try { payload.clipboard = await navigator.clipboard.readText(); } catch{}
  }

  let sm=null;
  const st = setTimeout(()=>{ setOrb("searching"); setSL("CONSULTANDO LA WEB...","search"); sm=addMsg("🌐 Buscando información...","system"); }, 1800);

  try {
    const d = await (await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})).json();
    clearTimeout(st); if(sm)sm.remove(); setSL("EN ESPERA");
    addMsg(d.res,"aura");
    speak(d.res);
    if (S.notif && document.hidden) new Notification("AURA",{body:d.res.substring(0,80)});
  } catch {
    clearTimeout(st); if(sm)sm.remove();
    setSL("ERROR",""); addMsg("Error de conexión, señor.","system");
  } finally { setOrb(""); }
}

// TTS
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,"").substring(0,220));
  utt.lang="es-AR"; utt.rate=0.93; utt.pitch=0.75;
  window.speechSynthesis.speak(utt);
}

// STT
function toggleMic() {
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) { addMsg("Voz no disponible en este navegador, señor.","system"); return; }
  if (S.listening) { S.recognition&&S.recognition.stop(); return; }
  S.recognition = new SR();
  S.recognition.lang="es-AR"; S.recognition.continuous=false; S.recognition.interimResults=false;
  S.recognition.onstart  = ()=>{ S.listening=true; setOrb("listening"); setSL("ESCUCHANDO...","listen"); document.getElementById("mic-btn").className="btn mic-on"; };
  S.recognition.onresult = e=>{ document.getElementById("input").value=e.results[0][0].transcript; autoResize(document.getElementById("input")); stopListen(); send(); };
  S.recognition.onerror  = stopListen;
  S.recognition.onend    = stopListen;
  S.recognition.start();
}
function stopListen() { S.listening=false; setOrb(""); setSL("EN ESPERA"); document.getElementById("mic-btn").className="btn"; }

// LIMPIAR
async function clearHistory() {
  await fetch("/clear",{method:"POST"});
  document.getElementById("chat").innerHTML="<div class=\"msg system\">Historial borrado, señor.</div>";
  S.image=null;
}
</script>
</body>
</html>
