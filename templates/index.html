
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Core</title>
    <style>
        body { background: #0a0f1e; color: #eee; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; box-shadow: 0 0 20px rgba(0,255,200,0.1); }
        #chat { height: 450px; overflow-y: auto; margin-bottom: 15px; padding: 10px; border-bottom: 1px solid #30363d; }
        .user { text-align: right; color: #58a6ff; margin: 10px 0; }
        .aura { text-align: left; color: #39FF14; margin: 10px 0; border-left: 2px solid #39FF14; padding-left: 10px; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 6px; }
        button { background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .status { font-size: 11px; color: #8b949e; margin-bottom: 10px; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="container">
    <div class="status" id="status">Sincronizando...</div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="prompt" placeholder="Orden, señor..." onkeypress="if(event.key==='Enter') enviar()">
        <button onclick="enviar()">EJECUTAR</button>
    </div>
</div>
<script>
    async function checkStatus() {
        try {
            const res = await fetch('/status');
            const data = await res.json();
            document.getElementById('status').innerHTML = data.api_key_configured ? '● Sistema Online' : '○ Error: Sin llave de acceso';
        } catch(e) { document.getElementById('status').innerHTML = '○ Desconectado'; }
    }
    checkStatus();

    async function enviar() {
        const p = document.getElementById('prompt');
        const val = p.value.trim();
        if (!val) return;
        const chat = document.getElementById('chat');
        chat.innerHTML += `<div class="user"><b>></b> ${val}</div>`;
        p.value = '';
        chat.scrollTop = chat.scrollHeight;

        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: val })
        });
        const data = await res.json();
        chat.innerHTML += `<div class="aura"><b>AURA:</b> ${data.res}</div>`;
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
