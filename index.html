
<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AURA</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
body{height:100vh;overflow:hidden;background:#05050f;color:#d0d0e8;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;}
#orb{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6464ff,#1e1e3c);box-shadow:0 0 50px rgba(100,100,255,0.4);animation:pulse 4s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
#mensaje{margin-top:30px;font-family:'Cinzel',serif;letter-spacing:3px;text-align:center;}
</style></head><body>
<div id="orb"></div>
<div id="mensaje">AURA<br>Conectada a joabyte/Aurai</div>
</body></html>
